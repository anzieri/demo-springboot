name: Java CI/CD (GitHub Hosted)

on:
  push:
    branches: [ main, develop ]

jobs:
  pipeline:
    runs-on: ubuntu-latest # Using GitHub's provisioned runners
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Version
        run: |
          mvn clean compile
          mvn help:evaluate -Dexpression=project.version -q -DforceStdout | cut -d'-' -f1 > version.txt
          echo "BASE_VERSION=$(cat version.txt)" >> $GITHUB_ENV

      - name: Unit Tests
        run: mvn test -Dspring.profiles.active=test
        # Note: If tests need Postgres, you'd add a 'services' block here

      - name: Package
        run: mvn package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build and Push
        run: |
          # Use lowercase for image names (Docker Hub requirement)
          IMAGE_NAME=$(echo "${{ secrets.DOCKER_USER }}/${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          FULL_VERSION="${{ env.BASE_VERSION }}.${{ github.run_number }}"
          docker build -t $IMAGE_NAME:$FULL_VERSION .
          docker run -d -p 8080:8082 -p 8081:8083 --name test-container $IMAGE_NAME:$FULL_VERSION
          sleep 10      
          curl -f http://localhost:8081/monitor/health || (echo "Health check failed" && exit 1)
          docker rm -f test-container
          docker tag $IMAGE_NAME:$FULL_VERSION $IMAGE_NAME:latest
          docker push $IMAGE_NAME:$FULL_VERSION
          docker push $IMAGE_NAME:latest